name: Pipeline DevSecOps

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21 requerido por Sonar
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Instalar y ejecutar SonarScanner
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=sistemasxp2014-eng_app-vulnerable-sesion4 \
            -Dsonar.organization=sistemasxp2014-eng \
            -Dsonar.sources=.
